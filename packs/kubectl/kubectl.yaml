apiVersion: cliharbor.dev/v1
kind: CliPack
metadata:
  id: kubectl-cli
  name: Kubernetes kubectl
  version: 0.4.0
  description: >-
    Narrow read-only Kubernetes inventory pack derived from the official kubectl
    reference. It exposes context visibility and selected metadata-only get
    operations while excluding kubeconfig contents, Secrets, ConfigMaps, logs,
    exec/attach/cp, port-forward/proxy, impersonation, and mutations. Stage 5
    adds workload-status and resource-utilization views using fixed projections.
runtime:
  platforms: [windows, linux, darwin]
  tools:
    kubectl:
      executableNames: [kubectl]
      install:
        version: 1.35.3
        artifacts:
          darwin-amd64:
            executableName: kubectl
            format: executable
            redirectHosts: [cdn.dl.k8s.io]
            sha256: 2f339b1eae2e1792ec08da281b37afbeee94f70bed6b7398e7efd81ba08f8d37
            sizeBytes: 59813904
            url: https://dl.k8s.io/release/v1.35.3/bin/darwin/amd64/kubectl
          darwin-arm64:
            executableName: kubectl
            format: executable
            redirectHosts: [cdn.dl.k8s.io]
            sha256: 280651239d84bab214ba83403666bf6976a5fa0dbdb41404f26eb6f276d34963
            sizeBytes: 56759842
            url: https://dl.k8s.io/release/v1.35.3/bin/darwin/arm64/kubectl
          linux-amd64:
            executableName: kubectl
            format: executable
            redirectHosts: [cdn.dl.k8s.io]
            sha256: fd31c7d7129260e608f6faf92d5984c3267ad0b5ead3bced2fe125686e286ad6
            sizeBytes: 58601656
            url: https://dl.k8s.io/release/v1.35.3/bin/linux/amd64/kubectl
          linux-arm64:
            executableName: kubectl
            format: executable
            redirectHosts: [cdn.dl.k8s.io]
            sha256: 6f0cd088a82dde5d5807122056069e2fac4ed447cc518efc055547ae46525f14
            sizeBytes: 55247032
            url: https://dl.k8s.io/release/v1.35.3/bin/linux/arm64/kubectl
          windows-amd64:
            executableName: kubectl.exe
            format: executable
            redirectHosts: [cdn.dl.k8s.io]
            sha256: 6c367f9c34be9a13a94eb523dd62006973e1d051adea7d6bcf800dde3f6e84df
            sizeBytes: 60102144
            url: https://dl.k8s.io/release/v1.35.3/bin/windows/amd64/kubectl.exe
          windows-arm64:
            executableName: kubectl.exe
            format: executable
            redirectHosts: [cdn.dl.k8s.io]
            sha256: 7f2d923aa852a8e909568f45da5780f6783007354ae11e6ab8001bc86c8c75aa
            sizeBytes: 55826944
            url: https://dl.k8s.io/release/v1.35.3/bin/windows/arm64/kubectl.exe
      versionProbe:
        args: [version, --client=true]
        parser: semver-text
        # kubectl >=1.24 also prints "Kustomize Version: v5.x"; read only the client token.
        prefix: "Client Version:"
        timeoutMillis: 2000
commands:
  context:
    name: Show active Kubernetes context
    description: Show the kubeconfig context name that subsequent cluster inventory commands will target.
    tool: kubectl
    risk: read
    argv:
      - literal: config
      - literal: current-context
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  client-version:
    name: kubectl client version
    description: Show kubectl client version metadata without contacting the Kubernetes API server.
    tool: kubectl
    risk: read
    argv:
      - literal: version
      - literal: --client=true
      - literal: --output=json
    output:
      mode: json
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  namespaces:
    name: List namespaces
    description: List namespace names and phase from the active Kubernetes context without returning namespace object bodies.
    tool: kubectl
    risk: read
    argv:
      - literal: get
      - literal: namespaces
      - literal: --output=custom-columns=NAME:.metadata.name,STATUS:.status.phase
      - literal: --no-headers
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  nodes:
    name: List nodes
    description: List node names plus kubelet and operating-system metadata without addresses, labels, annotations, or object bodies.
    tool: kubectl
    risk: read
    argv:
      - literal: get
      - literal: nodes
      - literal: --output=custom-columns=NAME:.metadata.name,KUBELET:.status.nodeInfo.kubeletVersion,OS:.status.nodeInfo.osImage
      - literal: --no-headers
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  pods:
    name: List pods
    description: List pod namespace, name, and phase across the active context without logs, environment, command, annotations, or object bodies.
    tool: kubectl
    risk: read
    argv:
      - literal: get
      - literal: pods
      - literal: --all-namespaces
      - literal: --output=custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase
      - literal: --no-headers
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  deployments:
    name: List deployments
    description: List deployment namespace, name, ready replicas, and available replicas across the active context without manifests or configuration data.
    tool: kubectl
    risk: read
    argv:
      - literal: get
      - literal: deployments
      - literal: --all-namespaces
      - literal: --output=custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas
      - literal: --no-headers
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  statefulsets:
    name: List StatefulSets
    description: List StatefulSet namespace, name, ready replicas, current replicas, and updated replicas across the active context without manifests or pod templates.
    tool: kubectl
    risk: read
    argv:
      - literal: get
      - literal: statefulsets
      - literal: --all-namespaces
      - literal: --output=custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.readyReplicas,CURRENT:.status.currentReplicas,UPDATED:.status.updatedReplicas
      - literal: --no-headers
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  daemonsets:
    name: List DaemonSets
    description: List DaemonSet namespace, name, desired scheduling count, ready count, and available count across the active context without manifests or pod templates.
    tool: kubectl
    risk: read
    argv:
      - literal: get
      - literal: daemonsets
      - literal: --all-namespaces
      - literal: --output=custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,DESIRED:.status.desiredNumberScheduled,READY:.status.numberReady,AVAILABLE:.status.numberAvailable
      - literal: --no-headers
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  jobs:
    name: List Jobs
    description: List Job namespace, name, succeeded count, active count, and failed count across the active context without manifests, commands, or environment data.
    tool: kubectl
    risk: read
    argv:
      - literal: get
      - literal: jobs
      - literal: --all-namespaces
      - literal: --output=custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,SUCCEEDED:.status.succeeded,ACTIVE:.status.active,FAILED:.status.failed
      - literal: --no-headers
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  node-usage:
    name: Node resource usage
    description: Show the current CPU and memory usage reported by the Kubernetes Metrics API for nodes; requires Metrics Server availability.
    tool: kubectl
    risk: read
    argv:
      - literal: top
      - literal: node
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session

  pod-usage:
    name: Pod resource usage
    description: Show current pod CPU and memory usage across namespaces from the Kubernetes Metrics API; requires Metrics Server availability.
    tool: kubectl
    risk: read
    argv:
      - literal: top
      - literal: pod
      - literal: --all-namespaces
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: true
      authMode: vendor-session
