apiVersion: cliharbor.dev/v1
kind: CliPack
metadata:
  id: cyberark-conjur-v9
  name: Conjur — CyberArk / Idira Secrets Manager CLI 9.x
  version: 0.5.0
  description: >-
    Reviewed Conjur CLI workflows verified from the official cyberark/conjur-cli-go
    v9.3.1 release (commit 7207d6a4a2005130978e10d03d7f6b55ab0216d6).
    Read operations plus reviewed change/destructive workflows (secret variable
    create/delete/permission/value and LDAP mappings) are exposed. Mutations require
    backend-bound explicit approval; secret-returning and interactive commands remain
    excluded from executable browser authority.
runtime:
  platforms: [windows, darwin]
  tools:
    conjur:
      executableNames: [conjur]
      versionProbe:
        args: [--version]
        parser: semver-text
        timeoutMillis: 3000
      versionConstraint: ">=9.3.1-0 <10.0.0-0"
      install:
        version: 9.3.1-7207d6a
        artifacts:
          windows-amd64:
            url: https://github.com/cyberark/conjur-cli-go/releases/download/v9.3.1/conjur_windows_amd64.exe
            sha256: da2b31ca00b8faaefb8e1fe891563b5cc07c39460e776fb42e7f89b05d3ee4f6
            sizeBytes: 21950000
            format: executable
            executableName: conjur.exe
            redirectHosts: [release-assets.githubusercontent.com]
          darwin-amd64:
            url: https://github.com/cyberark/conjur-cli-go/releases/download/v9.3.1/conjur_darwin_amd64
            sha256: b6997198513b1e08ea6199954898bfd1103032dcc9f03cc2852ce8a2f2811eb9
            sizeBytes: 21689104
            format: executable
            executableName: conjur
            redirectHosts: [release-assets.githubusercontent.com]
          darwin-arm64:
            url: https://github.com/cyberark/conjur-cli-go/releases/download/v9.3.1/conjur_darwin_arm64_v8.0
            sha256: 3c9ef7abcca34c890cccb35f56daa30864fd7438746ee1fa5a33b03f21578cf9
            sizeBytes: 19978704
            format: executable
            executableName: conjur
            redirectHosts: [release-assets.githubusercontent.com]
      sessionCheck:
        commandId: whoami
        unauthenticatedStderrContains: "please login again"
      helpProbes:
        root:
          args: [--help]
          timeoutMillis: 3000
        list:
          args: [list, --help]
          timeoutMillis: 3000
        resource:
          args: [resource, --help]
          timeoutMillis: 3000
        role:
          args: [role, --help]
          timeoutMillis: 3000
        issuer:
          args: [issuer, --help]
          timeoutMillis: 3000
        authn-ldap:
          args: [authn-ldap, --help]
          timeoutMillis: 3000
        policy-update:
          args: [policy, update, --help]
          timeoutMillis: 3000
        variable-set:
          args: [variable, set, --help]
          timeoutMillis: 3000
        whoami:
          args: [whoami, --help]
          timeoutMillis: 3000
commands:
  whoami:
    name: Who am I
    description: Display non-secret information about the currently authenticated Conjur identity.
    tool: conjur
    risk: read
    argv:
      - literal: whoami
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  list-resources:
    name: List resources
    description: >-
      List a bounded page of resources visible to the current Conjur identity.
      Page size is required so the browser never falls back to Conjur's much
      larger implicit list limit; use Result offset to fetch subsequent pages.
    tool: conjur
    risk: read
    inputs:
      - id: kind
        type: enum
        label: Resource kind
        validation:
          enum: [user, host, layer, group, policy, variable, webservice, host_factory]
          disallowLeadingDash: true
      - id: search
        type: string
        label: Search text
        validation:
          maxLength: 512
          disallowLeadingDash: true
      - id: limit
        type: enum
        label: Page size
        required: true
        validation:
          enum: ["25", "50", "100"]
          disallowLeadingDash: true
      - id: offset
        type: integer
        label: Result offset
        validation:
          min: 0
          max: 1000000000
      - id: role
        type: string
        label: Role ID
        validation:
          maxLength: 2048
          disallowLeadingDash: true
      - id: inspect
        type: boolean
        label: Include resource metadata
    argv:
      - literal: list
      - flag:
          name: --kind
          valueFrom: kind
          omitWhenEmpty: true
      - flag:
          name: --search
          valueFrom: search
          omitWhenEmpty: true
      - flag:
          name: --limit
          valueFrom: limit
      - flag:
          name: --offset
          valueFrom: offset
          omitWhenEmpty: true
      - flag:
          name: --role
          valueFrom: role
          omitWhenEmpty: true
      - switch:
          name: --inspect
          enabledFrom: inspect
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  count-resources:
    name: Count resources
    description: Count resources visible to the current Conjur identity with optional server-side filters.
    tool: conjur
    risk: read
    inputs:
      - id: kind
        type: enum
        label: Resource kind
        validation:
          enum: [user, host, layer, group, policy, variable, webservice, host_factory]
          disallowLeadingDash: true
      - id: search
        type: string
        label: Search text
        validation:
          maxLength: 512
          disallowLeadingDash: true
      - id: role
        type: string
        label: Role ID
        validation:
          maxLength: 2048
          disallowLeadingDash: true
    argv:
      - literal: list
      - flag:
          name: --kind
          valueFrom: kind
          omitWhenEmpty: true
      - flag:
          name: --search
          valueFrom: search
          omitWhenEmpty: true
      - flag:
          name: --role
          valueFrom: role
          omitWhenEmpty: true
      - literal: --count
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: cards
      structured:
        fields:
          - key: count
            label: Count
            type: integer
            required: true
    requirements:
      requiresAuth: true
      authMode: vendor-session

  resource-exists:
    name: Check resource exists
    description: Check whether a Conjur resource ID exists.
    tool: conjur
    risk: read
    inputs:
      - id: resource-id
        type: string
        label: Resource ID
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
    argv:
      - literal: resource
      - literal: exists
      - positional:
          valueFrom: resource-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: cards
      structured:
        fields:
          - key: exists
            label: Exists
            type: boolean
            required: true
    requirements:
      requiresAuth: true
      authMode: vendor-session

  resource-show:
    name: Show resource
    description: Show metadata for one Conjur resource.
    tool: conjur
    risk: read
    inputs:
      - id: resource-id
        type: string
        label: Resource ID
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
    argv:
      - literal: resource
      - literal: show
      - positional:
          valueFrom: resource-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  resource-permitted-roles:
    name: List permitted roles
    description: List roles with the requested privilege on a Conjur resource.
    tool: conjur
    risk: read
    inputs:
      - id: resource-id
        type: string
        label: Resource ID
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: privilege
        type: string
        label: Privilege
        required: true
        validation:
          minLength: 1
          maxLength: 64
          disallowLeadingDash: true
    argv:
      - literal: resource
      - literal: permitted-roles
      - positional:
          valueFrom: resource-id
      - positional:
          valueFrom: privilege
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  role-exists:
    name: Check role exists
    description: Check whether a Conjur role ID exists.
    tool: conjur
    risk: read
    inputs:
      - id: role-id
        type: string
        label: Role ID
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
    argv:
      - literal: role
      - literal: exists
      - positional:
          valueFrom: role-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: cards
      structured:
        fields:
          - key: exists
            label: Exists
            type: boolean
            required: true
    requirements:
      requiresAuth: true
      authMode: vendor-session

  role-show:
    name: Show role
    description: Show metadata for one Conjur role.
    tool: conjur
    risk: read
    inputs:
      - id: role-id
        type: string
        label: Role ID
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
    argv:
      - literal: role
      - literal: show
      - positional:
          valueFrom: role-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  role-members:
    name: List role members
    description: List members of a Conjur role, optionally with verbose membership objects.
    tool: conjur
    risk: read
    inputs:
      - id: role-id
        type: string
        label: Role ID
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: verbose
        type: boolean
        label: Verbose membership details
    argv:
      - literal: role
      - literal: members
      - positional:
          valueFrom: role-id
      - switch:
          name: --verbose
          enabledFrom: verbose
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  role-memberships:
    name: List role memberships
    description: List the roles to which a Conjur role belongs.
    tool: conjur
    risk: read
    inputs:
      - id: role-id
        type: string
        label: Role ID
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
    argv:
      - literal: role
      - literal: memberships
      - positional:
          valueFrom: role-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session


  issuer-delete:
    name: Delete issuer
    description: Delete one dynamic-secret issuer. This can also delete dynamic secrets associated with that issuer unless Keep associated secrets is enabled.
    tool: conjur
    risk: destructive
    impact:
      targetInput: issuer-id
      targetLabel: Issuer ID
      effect: Deletes the issuer. Associated dynamic secrets may also be deleted unless Keep associated secrets is enabled.
      scope: multiple
    inputs:
      - id: issuer-id
        type: string
        label: Issuer ID
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
      - id: keep-secrets
        type: boolean
        label: Keep associated dynamic secrets
    argv:
      - literal: issuer
      - literal: delete
      - flag:
          name: --id
          valueFrom: issuer-id
      - switch:
          name: --keep-secrets
          enabledFrom: keep-secrets
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  ldap-group-show:
    name: Show LDAP group mapping
    description: Show the Conjur roles currently mapped to one LDAP group.
    tool: conjur
    risk: read
    inputs:
      - id: group-name
        type: string
        label: LDAP group name
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
      - id: service-id
        type: string
        label: LDAP authenticator service ID
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
    argv:
      - literal: authn-ldap
      - literal: groups
      - literal: show
      - positional:
          valueFrom: group-name
      - flag:
          name: --id
          valueFrom: service-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  ldap-group-create:
    name: Create LDAP group mapping
    description: Map one LDAP group to one or more Conjur roles. This can grant access to multiple roles for every member of the LDAP group.
    tool: conjur
    risk: change
    impact:
      targetInput: group-name
      targetLabel: LDAP group
      effect: Creates a group-to-role mapping and may grant multiple Conjur role relationships to members of the LDAP group.
      scope: multiple
    inputs:
      - id: group-name
        type: string
        label: LDAP group name
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
      - id: roles
        type: string
        label: Conjur roles (comma-separated)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: service-id
        type: string
        label: LDAP authenticator service ID
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
    argv:
      - literal: authn-ldap
      - literal: groups
      - literal: create
      - positional:
          valueFrom: group-name
      - flag:
          name: --roles
          valueFrom: roles
      - flag:
          name: --id
          valueFrom: service-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  ldap-group-delete:
    name: Delete LDAP group mapping
    description: Delete an LDAP group mapping. Members of that LDAP group will stop receiving the mapped Conjur roles at login.
    tool: conjur
    risk: destructive
    impact:
      targetInput: group-name
      targetLabel: LDAP group
      effect: Deletes the LDAP group mapping and removes all role relationships granted through that mapping at future logins.
      scope: multiple
    inputs:
      - id: group-name
        type: string
        label: LDAP group name
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
      - id: service-id
        type: string
        label: LDAP authenticator service ID
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
    argv:
      - literal: authn-ldap
      - literal: groups
      - literal: delete
      - positional:
          valueFrom: group-name
      - flag:
          name: --id
          valueFrom: service-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  ldap-user-show:
    name: Show LDAP user mapping
    description: Show the Conjur roles currently mapped directly to one LDAP user.
    tool: conjur
    risk: read
    inputs:
      - id: username
        type: string
        label: LDAP username
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
      - id: service-id
        type: string
        label: LDAP authenticator service ID
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
    argv:
      - literal: authn-ldap
      - literal: users
      - literal: show
      - positional:
          valueFrom: username
      - flag:
          name: --id
          valueFrom: service-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  ldap-user-create:
    name: Create LDAP user mapping
    description: Map one LDAP user directly to one or more Conjur roles. This can grant multiple role relationships to that user.
    tool: conjur
    risk: change
    impact:
      targetInput: username
      targetLabel: LDAP user
      effect: Creates a direct user-to-role mapping and may grant multiple Conjur role relationships to this LDAP user.
      scope: multiple
    inputs:
      - id: username
        type: string
        label: LDAP username
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
      - id: roles
        type: string
        label: Conjur roles (comma-separated)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: service-id
        type: string
        label: LDAP authenticator service ID
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
    argv:
      - literal: authn-ldap
      - literal: users
      - literal: create
      - positional:
          valueFrom: username
      - flag:
          name: --roles
          valueFrom: roles
      - flag:
          name: --id
          valueFrom: service-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  ldap-user-delete:
    name: Delete LDAP user mapping
    description: Delete an LDAP user mapping. The user will stop receiving roles from this direct mapping at login.
    tool: conjur
    risk: destructive
    impact:
      targetInput: username
      targetLabel: LDAP user
      effect: Deletes the direct LDAP user mapping and removes all role relationships granted through that mapping at future logins.
      scope: multiple
    inputs:
      - id: username
        type: string
        label: LDAP username
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
      - id: service-id
        type: string
        label: LDAP authenticator service ID
        required: true
        validation:
          minLength: 1
          maxLength: 256
          disallowLeadingDash: true
    argv:
      - literal: authn-ldap
      - literal: users
      - literal: delete
      - positional:
          valueFrom: username
      - flag:
          name: --id
          valueFrom: service-id
      - literal: --output
      - literal: json
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  secret-create:
    name: Create secret variable
    description: >-
      Declare a new Conjur variable under a policy branch (conjur policy update).
      The variable starts without a value; use Set secret value afterwards.
    tool: conjur
    risk: change
    impact:
      targetInput: variable-id
      targetLabel: Variable
      effect: Adds a variable declaration to the policy branch. Existing resources are not changed.
      scope: single
    stdin:
      yamlTemplate: |
        - !variable
          id: {{variable-id}}
    inputs:
      - id: policy-branch
        type: string
        label: Policy branch
        required: true
        validation:
          minLength: 1
          maxLength: 512
          disallowLeadingDash: true
      - id: variable-id
        type: string
        label: Variable ID (relative to the policy branch)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: dry-run
        type: boolean
        label: Validate only (dry run, nothing is changed)
    argv:
      - literal: policy
      - literal: update
      - flag:
          name: --branch
          valueFrom: policy-branch
      - literal: --file
      - literal: "-"
      - switch:
          name: --dry-run
          enabledFrom: dry-run
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  secret-delete:
    name: Delete secret variable
    description: >-
      Delete a Conjur variable declared in a policy branch (conjur policy update
      with !delete). All stored secret versions and permissions on it are removed.
    tool: conjur
    risk: destructive
    impact:
      targetInput: variable-id
      targetLabel: Variable
      effect: Permanently deletes the variable, every stored secret version, and all permissions on it.
      scope: single
    stdin:
      yamlTemplate: |
        - !delete
          record: !variable {{variable-id}}
    inputs:
      - id: policy-branch
        type: string
        label: Policy branch
        required: true
        validation:
          minLength: 1
          maxLength: 512
          disallowLeadingDash: true
      - id: variable-id
        type: string
        label: Variable ID (relative to the policy branch)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: dry-run
        type: boolean
        label: Validate only (dry run, nothing is changed)
    argv:
      - literal: policy
      - literal: update
      - flag:
          name: --branch
          valueFrom: policy-branch
      - literal: --file
      - literal: "-"
      - switch:
          name: --dry-run
          enabledFrom: dry-run
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  secret-permit:
    name: Grant secret permission
    description: >-
      Grant a role privileges on a Conjur variable (conjur policy update with !permit).
      execute lets the role fetch the secret value; update lets it change the value.
    tool: conjur
    risk: change
    impact:
      targetInput: variable-id
      targetLabel: Variable
      effect: Grants the selected role the selected privileges on this variable.
      scope: single
    stdin:
      yamlTemplate: |
        - !permit
          role: !{{role-kind}} {{role-id}}
          privileges: [ {{privileges}} ]
          resource: !variable {{variable-id}}
    inputs:
      - id: policy-branch
        type: string
        label: Policy branch
        required: true
        validation:
          minLength: 1
          maxLength: 512
          disallowLeadingDash: true
      - id: variable-id
        type: string
        label: Variable ID (relative to the policy branch)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: role-kind
        type: enum
        label: Role kind
        required: true
        validation:
          enum: [host, group, layer, user]
          disallowLeadingDash: true
      - id: role-id
        type: string
        label: Role ID (relative to the policy branch; start with / for an absolute ID)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: privileges
        type: enum
        label: Privileges
        required: true
        validation:
          enum: ["read, execute", "read", "execute", "update", "read, execute, update"]
          disallowLeadingDash: true
      - id: dry-run
        type: boolean
        label: Validate only (dry run, nothing is changed)
    argv:
      - literal: policy
      - literal: update
      - flag:
          name: --branch
          valueFrom: policy-branch
      - literal: --file
      - literal: "-"
      - switch:
          name: --dry-run
          enabledFrom: dry-run
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  secret-deny:
    name: Revoke secret permission
    description: >-
      Revoke a role's privileges on a Conjur variable (conjur policy update with !deny).
      Conjur only removes permissions granted by the same policy branch, so use the
      branch that granted them. Check the result with List permitted roles.
    tool: conjur
    risk: change
    impact:
      targetInput: variable-id
      targetLabel: Variable
      effect: Removes the selected privileges from the selected role on this variable.
      scope: single
    stdin:
      yamlTemplate: |
        - !deny
          role: !{{role-kind}} {{role-id}}
          privileges: [ {{privileges}} ]
          resource: !variable {{variable-id}}
    inputs:
      - id: policy-branch
        type: string
        label: Policy branch
        required: true
        validation:
          minLength: 1
          maxLength: 512
          disallowLeadingDash: true
      - id: variable-id
        type: string
        label: Variable ID (relative to the policy branch)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: role-kind
        type: enum
        label: Role kind
        required: true
        validation:
          enum: [host, group, layer, user]
          disallowLeadingDash: true
      - id: role-id
        type: string
        label: Role ID (relative to the policy branch; start with / for an absolute ID)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: privileges
        type: enum
        label: Privileges
        required: true
        validation:
          enum: ["read, execute", "read", "execute", "update", "read, execute, update"]
          disallowLeadingDash: true
      - id: dry-run
        type: boolean
        label: Validate only (dry run, nothing is changed)
    argv:
      - literal: policy
      - literal: update
      - flag:
          name: --branch
          valueFrom: policy-branch
      - literal: --file
      - literal: "-"
      - switch:
          name: --dry-run
          enabledFrom: dry-run
    output:
      mode: json
      renderer: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session

  secret-set-value:
    name: Set secret value
    description: >-
      Store a new value for an existing Conjur variable (conjur variable set). The
      value is sent to the CLI on standard input only; it is never placed in the
      command line, shown back in the browser, or kept in run history.
    tool: conjur
    risk: change
    impact:
      targetInput: variable-id
      targetLabel: Variable (full ID)
      effect: Stores a new secret version for this variable. Applications that fetch it will receive the new value.
      scope: single
    stdin:
      input: value
    inputs:
      - id: variable-id
        type: string
        label: Variable ID (full ID, for example apps/myapp/db/password)
        required: true
        validation:
          minLength: 1
          maxLength: 2048
          disallowLeadingDash: true
      - id: value
        type: secret
        label: Secret value
        required: true
        validation:
          minLength: 1
          maxLength: 4096
    argv:
      - literal: variable
      - literal: set
      - flag:
          name: --id
          valueFrom: variable-id
      - literal: --file
      - literal: "-"
    output:
      mode: raw
    requirements:
      requiresAuth: true
      authMode: vendor-session
