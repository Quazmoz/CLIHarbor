apiVersion: cliharbor.dev/v1
kind: CliPack
metadata:
  id: terraform-cli
  name: HashiCorp Terraform
  version: 0.1.1
  description: >-
    Offline first-party Terraform CLI discovery and command-reference tasks.
    This initial pack never reads HCL configuration, state, variables, secrets,
    backend or workspace data, never downloads providers, and never mutates
    infrastructure. Project-scoped tasks require a separate reviewed design.
runtime:
  platforms: [windows, linux, darwin]
  tools:
    terraform:
      executableNames: [terraform]
      versionProbe:
        args: [version, -json]
        parser: semver-text
        # Terraform JSON includes provider versions; identify only the CLI version.
        prefix: '"terraform_version": "'
        timeoutMillis: 5000
      versionConstraint: ">=1.5.0 <2.0.0-0"
      helpProbes:
        root:
          args: [help]
        providers:
          args: [providers, -help]
        fmt:
          args: [fmt, -help]
commands:
  version:
    name: Terraform CLI version
    description: Show the installed Terraform CLI version/platform, without inspecting project, state, workspace or backend.
    tool: terraform
    risk: read
    argv:
      - literal: version
      - literal: -json
    output:
      mode: json
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  command-reference:
    name: Terraform command reference
    description: Show the installed CLI's top-level command help without reading project configuration or connecting to a backend.
    tool: terraform
    risk: read
    argv:
      - literal: help
    output:
      mode: raw
    requirements:
      requiresAuth: false

  provider-reference:
    name: Terraform provider command help
    description: Show syntax for the providers command without executing the state-reading providers subcommand.
    tool: terraform
    risk: read
    argv:
      - literal: providers
      - literal: -help
    output:
      mode: raw
    requirements:
      requiresAuth: false

  formatting-reference:
    name: Terraform formatting command help
    description: Show safe formatter options without reading or writing Terraform configuration files.
    tool: terraform
    risk: read
    argv:
      - literal: fmt
      - literal: -help
    output:
      mode: raw
    requirements:
      requiresAuth: false
