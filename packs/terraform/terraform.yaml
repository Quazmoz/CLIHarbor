apiVersion: cliharbor.dev/v1
kind: CliPack
metadata:
  id: terraform-cli
  name: HashiCorp Terraform
  version: 0.4.1
  description: >-
    Built-in Terraform CLI with offline version and help tasks only. Bounded
    configuration format checks and local state resource browsing use separate
    approved-project, read-only backend APIs. Generic task execution cannot
    read arbitrary state paths or
    detach resource bindings. Mutations stay disabled until an independently
    verified state identity, preview, locking and backup lifecycle is built.
runtime:
  platforms: [windows, linux, darwin]
  tools:
    terraform:
      executableNames: [terraform]
      versionProbe:
        args: [version, -json]
        parser: semver-text
        # Terraform JSON includes provider versions; identify only the CLI version.
        prefix: '"terraform_version": "'
        timeoutMillis: 5000
      versionConstraint: ">=1.5.0 <2.0.0-0"
      helpProbes:
        root:
          args: [help]
        providers:
          args: [providers, -help]
        fmt:
          args: [fmt, -help]
commands:
  version:
    name: Terraform CLI version
    description: Show the installed CLI version as plain text in an isolated temporary directory without contacting a backend.
    tool: terraform
    risk: read
    argv:
      - literal: version
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  command-reference:
    name: Terraform command reference
    description: Show the installed CLI's top-level command help without reading project configuration or connecting to a backend.
    tool: terraform
    risk: read
    argv:
      - literal: help
    output:
      mode: raw
    requirements:
      requiresAuth: false

  provider-reference:
    name: Terraform provider command help
    description: Show syntax for the providers command without executing the state-reading providers subcommand.
    tool: terraform
    risk: read
    argv:
      - literal: providers
      - literal: -help
    output:
      mode: raw
    requirements:
      requiresAuth: false

  formatting-reference:
    name: Terraform formatting command help
    description: Show safe formatter options without reading or writing Terraform configuration files.
    tool: terraform
    risk: read
    argv:
      - literal: fmt
      - literal: -help
    output:
      mode: raw
    requirements:
      requiresAuth: false

  workflow-reference:
    name: Terraform workflow command help
    description: >-
      Choose a Terraform workflow command to read its official built-in -help
      text. This never executes that workflow, opens a project, reads state,
      accesses a backend, or forwards flags supplied by the browser.
    tool: terraform
    risk: read
    inputs:
      - id: workflow
        type: enum
        label: Workflow command
        required: true
        validation:
          enum: [init, validate, plan, apply, destroy, workspace, state, output]
          disallowLeadingDash: true
    argv:
      - map:
          valueFrom: workflow
          values:
            init: init
            validate: validate
            plan: plan
            apply: apply
            destroy: destroy
            workspace: workspace
            state: state
            output: output
      - literal: -help
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

