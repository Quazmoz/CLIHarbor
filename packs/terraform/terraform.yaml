apiVersion: cliharbor.dev/v1
kind: CliPack
metadata:
  id: terraform-cli
  name: HashiCorp Terraform
  version: 0.1.2
  description: >-
    Offline Terraform CLI version and command-reference tasks. Discovery and
    execution use isolated temporary working directories with a minimal
    environment rather than the operator's Terraform project and credentials.
    This pack never runs infrastructure operations or reads state. Project
    workflows need a separately reviewed execution and output boundary.
runtime:
  platforms: [windows, linux, darwin]
  tools:
    terraform:
      executableNames: [terraform]
      versionProbe:
        args: [version, -json]
        parser: semver-text
        # Terraform JSON includes provider versions; identify only the CLI version.
        prefix: '"terraform_version": "'
        timeoutMillis: 5000
      versionConstraint: ">=1.5.0 <2.0.0-0"
      helpProbes:
        root:
          args: [help]
        providers:
          args: [providers, -help]
        fmt:
          args: [fmt, -help]
commands:
  version:
    name: Terraform CLI version
    description: Show Terraform CLI version and platform in an isolated temporary directory without contacting a backend. Terraform may include provider selections from that isolated directory.
    tool: terraform
    risk: read
    argv:
      - literal: version
      - literal: -json
    output:
      mode: json
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  command-reference:
    name: Terraform command reference
    description: Show the installed CLI's top-level command help without reading project configuration or connecting to a backend.
    tool: terraform
    risk: read
    argv:
      - literal: help
    output:
      mode: raw
    requirements:
      requiresAuth: false

  provider-reference:
    name: Terraform provider command help
    description: Show syntax for the providers command without executing the state-reading providers subcommand.
    tool: terraform
    risk: read
    argv:
      - literal: providers
      - literal: -help
    output:
      mode: raw
    requirements:
      requiresAuth: false

  formatting-reference:
    name: Terraform formatting command help
    description: Show safe formatter options without reading or writing Terraform configuration files.
    tool: terraform
    risk: read
    argv:
      - literal: fmt
      - literal: -help
    output:
      mode: raw
    requirements:
      requiresAuth: false
