apiVersion: cliharbor.dev/v1
kind: CliPack
metadata:
  id: docker-cli
  name: Docker CLI
  version: 0.1.0
  description: >-
    Small read-only Docker inventory pack derived from the official Docker CLI
    reference. It intentionally excludes container command lines, labels,
    environment/config inspection, logs, exec, mutations, and secret-bearing
    Swarm resources.
runtime:
  platforms: [windows, linux, darwin]
  tools:
    docker:
      executableNames: [docker]
      versionProbe:
        args: [--version]
        parser: semver-text
        timeoutMillis: 2000
commands:
  version:
    name: Docker version
    description: Show Docker client and engine version information in Docker's JSON format.
    tool: docker
    risk: read
    argv:
      - literal: version
      - literal: --format
      - literal: json
    output:
      mode: json
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  containers:
    name: List containers
    description: List running and stopped containers without exposing command lines, labels, mounts, or environment data.
    tool: docker
    risk: read
    argv:
      - literal: container
      - literal: ls
      - literal: --all
      - literal: --format
      - literal: 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.State}}\t{{.Status}}\t{{.Ports}}'
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  images:
    name: List images
    description: List local Docker images using only ID, repository, tag, and size fields.
    tool: docker
    risk: read
    argv:
      - literal: image
      - literal: ls
      - literal: --all
      - literal: --format
      - literal: 'table {{.ID}}\t{{.Repository}}\t{{.Tag}}\t{{.Size}}'
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  networks:
    name: List networks
    description: List Docker network identity and driver metadata without labels or detailed endpoint configuration.
    tool: docker
    risk: read
    argv:
      - literal: network
      - literal: ls
      - literal: --format
      - literal: 'table {{.ID}}\t{{.Name}}\t{{.Driver}}\t{{.Scope}}\t{{.IPv6}}\t{{.Internal}}'
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false

  volumes:
    name: List volumes
    description: List Docker volume names, drivers, and scopes without labels or host mount paths.
    tool: docker
    risk: read
    argv:
      - literal: volume
      - literal: ls
      - literal: --format
      - literal: 'table {{.Name}}\t{{.Driver}}\t{{.Scope}}'
    output:
      mode: raw
      sensitivity:
        containsSecrets: false
        persistRawOutput: false
        revealByDefault: false
    requirements:
      requiresAuth: false
