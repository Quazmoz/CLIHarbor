name: Temporary Conjur access qualification

on:
  push:
    branches: [feat/conjur-access-explorer]

concurrency:
  group: conjur-access-qualify
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: go run ./tools/task sync-web
      - name: Commit exactly generated embedded assets to the feature branch
        shell: bash
        run: |
          git add internal/webui/static
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(web): synchronize verified embedded frontend"
            git push origin HEAD:feat/conjur-access-explorer
          fi
      - run: go run ./tools/task verify-web-sync
      - run: go mod verify
      - run: go fmt ./...
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -timeout 2m ./...
      - name: Production embedded Chrome E2E
        env:
          CLIHARBOR_BROWSER_E2E: '1'
        run: go test -timeout 90s -count=1 -run '^TestProductionEmbeddedBrowserE2E$' ./internal/app
      - run: npm audit --prefix web --audit-level=high
      - run: go run ./tools/task go-build
  windows:
    runs-on: windows-latest
    needs: linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/conjur-access-explorer
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: go run ./tools/task verify-web-sync
      - run: go vet ./...
      - run: go test -timeout 2m ./...
      - run: go run ./tools/task go-build
      - run: go run ./tools/task windows-eval
      - run: .\bin\cliharbor-windows-x64-evaluation.exe self-test
