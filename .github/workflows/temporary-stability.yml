name: Temporary full stability qualification
on:
  push:
    branches: [fix/stability-route-install-qualification]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: go run ./tools/task sync-web
      - name: Verify committed embedded frontend
        run: go run ./tools/task verify-web-sync
      - name: Verify Go formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - run: go mod verify
      - run: go vet ./...
      - run: go test -timeout 2m ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -timeout 3m ./...
      - name: Frontend dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --prefix web --audit-level=high
      - name: Embedded frontend executable build
        run: go run ./tools/task go-build
      - name: Production embedded browser E2E
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        env:
          CLIHARBOR_BROWSER_E2E: '1'
        run: go test -timeout 90s -count=1 -run '^TestProductionEmbeddedBrowserE2E
      - name: Emit generated frontend assets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(dir) {
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.isFile()) {
                const name = p.split(path.sep).join('/');
                const content = fs.readFileSync(p);
                const encoded = content.toString('base64');
                console.log('SYNC_FILE:' + name + ':' + content.length);
                for (let i = 0; i < encoded.length; i += 1200) {
                  console.log('SYNC_CHUNK:' + name + ':' + Math.floor(i / 1200) + ':' + encoded.slice(i, i + 1200));
                }
              }
            }
          }
          walk('internal/webui/static');
          console.log('SYNC_FINISHED');
          NODE
 ./internal/app
      - name: Emit generated frontend assets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(dir) {
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.isFile()) {
                const name = p.split(path.sep).join('/');
                const content = fs.readFileSync(p);
                const encoded = content.toString('base64');
                console.log('SYNC_FILE:' + name + ':' + content.length);
                for (let i = 0; i < encoded.length; i += 1200) {
                  console.log('SYNC_CHUNK:' + name + ':' + Math.floor(i / 1200) + ':' + encoded.slice(i, i + 1200));
                }
              }
            }
          }
          walk('internal/webui/static');
          console.log('SYNC_FINISHED');
          NODE
