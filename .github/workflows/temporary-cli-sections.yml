name: Temporary CLI section qualification
on:
  push:
    branches:
      - ui/header-cli-section-switcher
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Typecheck
        run: npm run typecheck --prefix web
      - name: Lint
        run: npm run lint --prefix web
      - name: Frontend regression tests
        run: npm test --prefix web
      - name: Build frontend
        run: npm run build --prefix web
      - name: Sync embedded frontend
        run: go run ./tools/task sync-web
      - name: Verify embedded frontend
        run: go run ./tools/task verify-web-sync
      - name: Go embedded frontend tests
        run: go test -timeout 2m ./internal/webui ./internal/app
      - name: Emit generated public frontend files
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile()) {
                const name = p.split(path.sep).join('/');
                const content = fs.readFileSync(p);
                const encoded = content.toString('base64');
                console.log('SYNC_FILE:' + name + ':' + content.length);
                for (let i = 0; i < encoded.length; i += 1200) {
                  console.log('SYNC_CHUNK:' + name + ':' + Math.floor(i / 1200) + ':' + encoded.slice(i, i + 1200));
                }
              }
            }
          }
          walk('internal/webui/static');
          console.log('SYNC_FINISHED');
          NODE
