name: Temporary generated frontend synchronization

on:
  push:
    branches:
      - fix/browser-login-entry

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go run ./tools/task sync-web
      - name: Commit generated frontend
        shell: bash
        run: |
          if git diff --quiet -- internal/webui/static; then
            echo "Embedded frontend is already synchronized."
            exit 0
          fi
          if [ -n "$(git status --porcelain --untracked-files=all | grep -v ' internal/webui/static/')" ]; then
            echo "Unexpected generated changes outside internal/webui/static." >&2
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/webui/static
          git commit -m "Synchronize embedded frontend"
          git push origin HEAD:${GITHUB_REF_NAME}
