name: Regenerate embedded frontend once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate embedded frontend
    if: github.event.head_commit.message == 'Regenerate embedded frontend via pinned CI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Build production frontend
        run: npm run build --prefix web
      - name: Synchronize embedded frontend
        run: go run ./tools/task sync-web
      - name: Commit synchronized assets
        shell: bash
        run: |
          set -euo pipefail
          git add --all -- internal/webui/static
          if git diff --cached --quiet; then
            echo "Expected generated frontend drift was not present." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronize embedded frontend assets"
          git push origin HEAD:main
