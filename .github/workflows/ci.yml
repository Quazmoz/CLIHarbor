name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Frontend typecheck
        run: npm run typecheck --prefix web
      - name: Frontend lint
        run: npm run lint --prefix web
      - name: Frontend tests
        run: npm test --prefix web
      - name: Frontend production build
        run: npm run build --prefix web
      - name: Generate embedded frontend
        run: go run ./tools/task sync-web
      - name: Capture generated frontend for synchronization
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-web-${{ github.sha }}
          path: internal/webui/static
          if-no-files-found: error
          retention-days: 1
      - name: Verify embedded frontend is synchronized
        run: go run ./tools/task verify-web-sync
      - name: Verify Go module integrity
        run: go mod verify
      - name: Go format check
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -timeout 2m ./...
      - name: Production embedded browser E2E
        if: matrix.os == 'ubuntu-latest'
        env:
          CLIHARBOR_BROWSER_E2E: '1'
        run: go test -timeout 90s -count=1 -run '^TestProductionEmbeddedBrowserE2E$' ./internal/app
      - name: Final embedded Go build
        run: go run ./tools/task go-build

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Audit frontend dependency lock
        run: npm audit --prefix web --audit-level=high
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - run: go test -race -timeout 2m ./...

  windows-evaluation:
    name: Windows x64 evaluation artifact
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [quality, security, race]
    permissions:
      contents: read
    env:
      CLIHARBOR_VERSION: 0.0.0-eval
      CLIHARBOR_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Build unsigned Windows x64 evaluation executable
        run: go run ./tools/task windows-eval
      - name: Verify evaluation build metadata
        run: .\bin\cliharbor-windows-x64-evaluation.exe version
      - name: Verify deterministic Windows evaluation rebuild
        run: go run ./tools/task verify-windows-eval-repro
      - name: Verify authoritative evaluation bundle
        run: go run ./tools/task verify-windows-eval
      - name: Run vendor-free evaluation self-test
        run: .\bin\cliharbor-windows-x64-evaluation.exe self-test
      - name: Verify embedded first-party Conjur pack without network setup
        shell: pwsh
        run: |
          $doctorOutput = & .\bin\cliharbor-windows-x64-evaluation.exe doctor 2>&1
          $doctorOutput | ForEach-Object { Write-Host $_ }
          if (($doctorOutput -join "`n") -notmatch 'Configured packs: 1') {
            throw "zero-config doctor did not load exactly one embedded first-party pack"
          }
          if (($doctorOutput -join "`n") -notmatch 'cyberark-conjur-v9/conjur:') {
            throw "zero-config doctor did not expose the embedded Conjur tool state"
          }
      - name: Run extracted-bundle evaluation preflight
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "cliharbor-evaluation-preflight"
          $vendorSentinel = Join-Path $env:RUNNER_TEMP "cliharbor-vendor-sentinel"
          Remove-Item -Recurse -Force $bundle -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $vendorSentinel -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $bundle "bin") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $bundle "packs\phase0") | Out-Null
          New-Item -ItemType Directory -Force $vendorSentinel | Out-Null
          Copy-Item .\EVALUATION_SHA256SUMS (Join-Path $bundle "EVALUATION_SHA256SUMS")
          Copy-Item .\bin\cliharbor-windows-x64-evaluation.exe (Join-Path $bundle "bin\cliharbor-windows-x64-evaluation.exe")
          Copy-Item .\packs\phase0\idira-cyberark-inventory.yaml (Join-Path $bundle "packs\phase0\idira-cyberark-inventory.yaml")

          Set-Content -NoNewline (Join-Path $vendorSentinel "idsec.exe") "must-not-launch"
          Set-Content -NoNewline (Join-Path $vendorSentinel "conjur.exe") "must-not-launch"
          $env:PATH = "$vendorSentinel;$env:PATH"

          & (Join-Path $bundle "bin\cliharbor-windows-x64-evaluation.exe") evaluation preflight --bundle $bundle
          if ($LASTEXITCODE -ne 0) {
            throw "evaluation preflight failed with exit code $LASTEXITCODE"
          }
      - name: Verify packaged Phase 0 evidence integrity flow
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "cliharbor-phase0-smoke.json"
          $pack = Join-Path $PWD "packs\phase0\idira-cyberark-inventory.yaml"
          $exportOutput = & .\bin\cliharbor-windows-x64-evaluation.exe inventory --pack-file $pack --export $evidence
          if ($LASTEXITCODE -ne 0) {
            throw "packaged Phase 0 inventory export failed with exit code $LASTEXITCODE"
          }
          $exportOutput | ForEach-Object { Write-Host $_ }

          $bundle = Get-Content -Raw $evidence | ConvertFrom-Json
          $tools = @($bundle.tools)
          $expectedToolIdentities = @(
            "idira-cyberark-phase0/conjur",
            "idira-cyberark-phase0/idsec"
          )
          $actualToolIdentities = @(
            $tools |
              ForEach-Object { "$($_.packId)/$($_.toolId)" } |
              Sort-Object
          )
          if (($actualToolIdentities -join "`n") -ne ($expectedToolIdentities -join "`n")) {
            throw "packaged Phase 0 evidence did not contain exactly the expected discovery-only tools"
          }
          foreach ($tool in $tools) {
            if ($tool.packVersion -ne "0.1.0") {
              throw "packaged Phase 0 evidence reported an unexpected pack version"
            }

            $helpProbeCount = 0
            if ($null -ne $tool.availableHelpProbes) {
              $helpProbeCount = @($tool.availableHelpProbes).Count
            }
            $executedProbeCount = 0
            if ($null -ne $tool.probes) {
              $executedProbeCount = @($tool.probes).Count
            }
            $versionProbeConfigured = [bool]$tool.versionProbeConfigured
            if ($versionProbeConfigured -or $helpProbeCount -ne 0 -or $executedProbeCount -ne 0) {
              throw "packaged Phase 0 pack unexpectedly granted vendor probe execution authority (version=$versionProbeConfigured help=$helpProbeCount executed=$executedProbeCount)"
            }
          }

          $digestMatch = $exportOutput |
            Select-String -Pattern '^Evidence SHA-256: ([0-9a-f]{64})$' |
            Select-Object -First 1
          if (-not $digestMatch) {
            throw "inventory export did not emit a canonical SHA-256"
          }
          $digest = $digestMatch.Matches[0].Groups[1].Value

          $checksumOutput = & .\bin\cliharbor-windows-x64-evaluation.exe evidence checksum $evidence
          if ($LASTEXITCODE -ne 0) {
            throw "evidence checksum failed with exit code $LASTEXITCODE"
          }
          $checksumOutput | ForEach-Object { Write-Host $_ }
          if ($checksumOutput -notcontains "Evidence SHA-256: $digest") {
            throw "evidence checksum did not match export digest"
          }

          & .\bin\cliharbor-windows-x64-evaluation.exe evidence inspect --sha256 $digest $evidence
          if ($LASTEXITCODE -ne 0) {
            throw "verified evidence inspection failed with exit code $LASTEXITCODE"
          }
      - name: Re-verify authoritative evaluation bundle before upload
        run: go run ./tools/task verify-windows-eval
      - name: Upload unsigned evaluation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cliharbor-windows-x64-evaluation-${{ github.sha }}
          path: |
            EVALUATION_SHA256SUMS
            bin/cliharbor-windows-x64-evaluation.exe
            packs/phase0/idira-cyberark-inventory.yaml
          if-no-files-found: error
          retention-days: 14
