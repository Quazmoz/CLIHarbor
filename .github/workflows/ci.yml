name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Frontend typecheck
        run: npm run typecheck --prefix web
      - name: Frontend lint
        run: npm run lint --prefix web
      - name: Frontend tests
        run: npm test --prefix web
      - name: Frontend production build
        run: npm run build --prefix web
      - name: Verify embedded frontend is synchronized
        run: |
          go run ./tools/task sync-web
          git diff --exit-code -- internal/webui/static
      - name: Verify Go module integrity
        run: go mod verify
      - name: Go format check
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -timeout 2m ./...
      - name: Final embedded Go build
        run: go run ./tools/task go-build

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Audit frontend dependency lock
        run: npm audit --prefix web --audit-level=high
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test -race -timeout 2m ./...

  windows-evaluation:
    name: Windows x64 evaluation artifact
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [quality, security, race]
    permissions:
      contents: read
    env:
      CLIHARBOR_VERSION: 0.0.0-eval
      CLIHARBOR_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build unsigned Windows x64 evaluation executable
        run: go run ./tools/task windows-eval
      - name: Verify evaluation build metadata
        run: .\bin\cliharbor-windows-x64-evaluation.exe version
      - name: Run vendor-free evaluation self-test
        run: .\bin\cliharbor-windows-x64-evaluation.exe self-test
      - name: Upload unsigned evaluation artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cliharbor-windows-x64-evaluation-${{ github.sha }}
          path: |
            bin/cliharbor-windows-x64-evaluation.exe
            bin/SHA256SUMS
            packs/phase0/idira-cyberark-inventory.yaml
          if-no-files-found: error
          retention-days: 14
