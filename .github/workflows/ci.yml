name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Frontend typecheck
        run: npm run typecheck --prefix web
      - name: Frontend lint
        run: npm run lint --prefix web
      - name: Frontend tests
        run: npm test --prefix web
      - name: Frontend production build
        run: npm run build --prefix web
      - name: Verify embedded frontend is synchronized
        run: |
          go run ./tools/task sync-web
          git diff --exit-code -- internal/webui/static
      - name: Verify Go module integrity
        run: go mod verify
      - name: Go format check
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -timeout 2m ./...
      - name: Final embedded Go build
        run: go run ./tools/task go-build

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test -race -timeout 2m ./...
