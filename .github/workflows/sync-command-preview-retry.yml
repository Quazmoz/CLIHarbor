name: One-time preview retry qualification

on:
  push:
    branches:
      - feature/command-preview-retry

permissions:
  contents: write

jobs:
  qualify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Build and synchronize frontend
        run: go run ./tools/task web-build
      - name: Run repository qualification
        run: go run ./tools/task check
      - name: Commit canonical generated frontend
        shell: bash
        run: |
          git add internal/webui/static
          if git diff --cached --quiet; then
            echo "Generated frontend already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync generated command preview and retry frontend"
          git push origin HEAD:feature/command-preview-retry

# One-time branch qualification trigger.
