name: Sync generated frontend once

on:
  push:
    branches: [feature/command-preview-retry]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/command-preview-retry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Build and synchronize frontend
        run: |
          npm ci --prefix web
          npm run build --prefix web
          go run ./tools/task sync-web
      - name: Commit generated frontend and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-generated-web-once.yml
          git add -A internal/webui/static
          git diff --cached --quiet && { echo "expected generated frontend changes"; exit 1; }
          git commit -m "Sync generated frontend after preview race fix"
          git push origin HEAD:feature/command-preview-retry
