name: Bootstrap frontend lockfile

on:
  pull_request:
    paths:
      - 'web/**'
      - '.node-version'
      - '.github/workflows/bootstrap-web.yml'

permissions:
  contents: write

jobs:
  web:
    name: Generate and verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install exact frontend dependencies
        run: npm install --prefix web
      - name: Typecheck
        run: npm run typecheck --prefix web
      - name: Lint
        run: npm run lint --prefix web
      - name: Test
        run: npm test --prefix web
      - name: Build
        run: npm run build --prefix web
      - name: Stage generated frontend outputs
        run: |
          rm -rf internal/webui/static
          mkdir -p internal/webui/static
          cp -R web/dist/. internal/webui/static/
      - name: Commit generated frontend outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json internal/webui/static
          if ! git diff --cached --quiet; then
            git commit -m "build: commit generated frontend outputs"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload generated frontend inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cliharbor-web-bootstrap
          path: |
            web/package-lock.json
            web/dist
          if-no-files-found: error
          retention-days: 1
