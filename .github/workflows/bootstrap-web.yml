name: Bootstrap frontend lockfile

on:
  pull_request:
    paths:
      - 'web/**'
      - '.node-version'
      - '.github/workflows/bootstrap-web.yml'

permissions:
  contents: read

jobs:
  web:
    name: Generate and verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install exact frontend dependencies
        run: npm install --prefix web
      - name: Typecheck
        run: npm run typecheck --prefix web
      - name: Lint
        run: npm run lint --prefix web
      - name: Test
        run: npm test --prefix web
      - name: Build
        run: npm run build --prefix web
      - name: Upload generated frontend inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cliharbor-web-bootstrap
          path: |
            web/package-lock.json
            web/dist
          if-no-files-found: error
          retention-days: 1
