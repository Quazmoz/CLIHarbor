name: Temporary generated frontend sync

on:
  push:
    branches:
      - feature/generic-authentication-ui

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go run ./tools/task sync-web
      - name: Commit exact generated assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- internal/webui/static)" ]]; then
            echo "Generated frontend is already synchronized."
            exit 0
          fi
          git add internal/webui/static
          unexpected="$(git diff --cached --name-only | grep -v '^internal/webui/static/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Refusing to commit unexpected generated paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync generated authentication frontend"
          git push origin "HEAD:${{ github.ref_name }}"
