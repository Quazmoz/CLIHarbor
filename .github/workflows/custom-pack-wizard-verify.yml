name: Custom pack wizard verification
on:
  push:
    branches:
      - feat/guided-cli-pack-authoring
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: go run ./tools/task sync-web
      - run: git status --porcelain=v1 -- internal/webui/static
      - run: go test -timeout 2m ./internal/webui ./internal/platforms/... ./internal/packs/...
      - name: Validate browser-produced pack with native pack loader
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { preparePackDraft } from './web/src/packDraft.ts';
          const result = preparePackDraft({
            packId: 'sample-scratch',
            name: 'Sample CLI',
            toolId: 'sample',
            executable: 'sample',
            platforms: ['windows', 'darwin', 'linux'],
          });
          if (!result.yaml) throw Error(JSON.stringify(result.issues));
          writeFileSync('/tmp/cliharbor-wizard-sample.yaml', result.yaml);
          JS
          go run ./cmd/cliharbor pack validate /tmp/cliharbor-wizard-sample.yaml
          go run ./cmd/cliharbor pack lint /tmp/cliharbor-wizard-sample.yaml
      - name: Export generated asset bytes
        shell: bash
        run: |
          shopt -s nullglob
          files=(internal/webui/static/index.html internal/webui/static/assets/*)
          for file in "${files[@]}"; do
            while IFS= read -r chunk; do
              printf 'UI_ASSET|%s|%s\n' "$file" "$chunk"
            done < <(base64 -w 1000 "$file")
          done
