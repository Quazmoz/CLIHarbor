name: Temporary generated web sync

on:
  push:
    branches: [fix/conjur-interactive-login]

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Quazmoz/CLIHarbor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go run ./tools/task sync-web
      - name: Commit generated frontend only when changed
        shell: bash
        run: |
          if git diff --quiet -- internal/webui/static; then
            echo "Generated frontend already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/webui/static
          git commit -m "Sync combined generated frontend assets"
          git push origin HEAD:fix/conjur-interactive-login
